name: Pipeline CI - Build y Pruebas

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Compilar aplicacion
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Compilar con Maven
        working-directory: app
        run: ./mvnw -B clean compile

  test:
    name: Ejecutar pruebas unitarias
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configurar JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Run tests with Maven
        working-directory: app
        run: ./mvnw -B test

      - name: Run Code Coverage with Maven
        working-directory: app
        run: ./mvnw -B verify

      - name: Publicar resumen de pruebas en el log
        if: always()
        working-directory: app
        run: |
          echo "================================"
          echo "   RESULTADO DE LAS PRUEBAS"
          echo "================================"
          for f in target/surefire-reports/*.txt; do
            echo "--- $f ---"
            cat "$f"
          done

      - name: Publicar reporte de pruebas (JUnit)
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Reporte de Pruebas Unitarias
          path: app/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: true

      - name: Subir artefacto - reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-pruebas
          path: app/target/surefire-reports/
          retention-days: 15

      - name: Subir artefacto - reporte de cobertura (JaCoCo)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reporte-cobertura
          path: app/target/site/jacoco/
          retention-days: 15

      - name: Finalizar pipeline
        run: echo "Compilacion y pruebas ejecutadas correctamente. Quality Gate superado."
